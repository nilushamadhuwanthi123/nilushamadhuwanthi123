name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: nilushamadhuwanthi123
          SETTING_JSON: profile3d-settings.json

      - name: Push generated SVG to profile3d-data branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan profile3d-data-tmp
          git reset
          git add profile-3d-contrib
          git commit -m "generated"
          git push origin profile3d-data-tmp:profile3d-data --force
